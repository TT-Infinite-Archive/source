name: Check out the build tools
description: Checks the private build tools out at tools/.

inputs:
  token:
    description: BUILD_TOOLS_TOKEN
    required: true

outputs:
  sha:
    description: The build tools commit that was checked out.
    value: ${{ steps.checkout.outputs.sha }}

runs:
  using: composite
  steps:
    - id: checkout
      shell: bash
      env:
        BUILD_TOOLS_TOKEN: ${{ inputs.token }}
      run: |
        echo "::add-mask::$BUILD_TOOLS_TOKEN"

        auth=$(printf 'oauth2:%s' "$BUILD_TOOLS_TOKEN" | base64 | tr -d '\n')
        echo "::add-mask::$auth"

        rev=$(tr -d '[:space:]' < .github/build-tools-rev 2> /dev/null || true)

        if [ -z "$rev" ]; then
            echo "::error::No build tools commit in .github/build-tools-rev." \
                 "Run python tools/release.py --pin-tools."
            exit 1
        fi

        git init -q tools
        git -C tools remote add origin \
            https://git.toontown.io/toontown-infinite/build-tools.git
        git -C tools -c http.extraheader="Authorization: Basic $auth" \
            fetch -q origin
        git -C tools checkout -q "$rev"

        echo "sha=$(git -C tools rev-parse HEAD)" >> "$GITHUB_OUTPUT"