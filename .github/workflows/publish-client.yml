name: Publish client

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        default: live
        type: string
      promote:
        description: "Point latest.json at this version when the build lands."
        default: true
        type: boolean
      early:
        description: "Point each platform at this version as soon as its build lands."
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.5)."
        required: true
        type: string
      channel:
        description: "Which channel it goes out on."
        default: live
        type: choice
        options: [live, qa]
      promote:
        description: "Point latest.json at this version when the build lands."
        default: true
        type: boolean
      early:
        description: "Point each platform at this version as soon as its build lands."
        default: false
        type: boolean

env:
  BUCKET: ttiwebsite
  PREFIX: releases
  INDEX: release-index
  PACK_FORMAT: "1"
  AWS_DEFAULT_REGION: auto
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required

jobs:
  resources:
    name: Pack the resources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Check out the build tools
        id: tools
        uses: ./.github/actions/build-tools
        with:
          token: ${{ secrets.BUILD_TOOLS_TOKEN }}

      - name: Look for an identical resource pack
        id: pack
        shell: bash
        run: |
          set -euo pipefail

          art=$(git -C resources rev-parse HEAD)
          key=$(printf '%s\n' \
                  "$PACK_FORMAT" \
                  "$art" \
                  "${{ steps.tools.outputs.sha }}" \
                  "$(sha256sum requirements.txt | cut -d' ' -f1)" \
              | sha256sum | cut -d' ' -f1)

          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Art \`$art\`, pack key \`$key\`." >> "$GITHUB_STEP_SUMMARY"

          if aws s3 cp "s3://$BUCKET/$INDEX/resources-$key.json" recorded.json \
                  --only-show-errors 2> /dev/null; then
              # The sweep may have taken the blobs of a pack no kept release uses:
              missing=$(jq -r '.files[].sha256' recorded.json | sort -u | while read -r sha; do
                  aws s3api head-object --bucket "$BUCKET" --key "$PREFIX/blob/$sha" \
                      > /dev/null 2>&1 || echo "$sha"
              done)

              if [ -n "$missing" ]; then
                  echo "::warning::The recorded resource pack lost $(echo "$missing" | wc -l) blob(s) to the sweep; rebuilding it."
                  echo "hit=false" >> "$GITHUB_OUTPUT"
              else
                  echo "hit=true" >> "$GITHUB_OUTPUT"
              fi
          else
              echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.pack.outputs.hit != 'true'
        with:
          python-version: "3.14"
          cache: pip

      - name: Fetch Panda3D
        if: steps.pack.outputs.hit != 'true'
        uses: ./.github/actions/panda3d
        with:
          target: linux-x64

      - name: Pack the phase multifiles
        if: steps.pack.outputs.hit != 'true'
        run: |
          pip install --disable-pip-version-check wheels/*.whl -r requirements.txt
          python tools/pack_client_resources.py resources build/client/resources

      - name: Describe them
        if: steps.pack.outputs.hit != 'true'
        run: |
          python tools/build_manifest.py \
              --tree build/client/resources \
              --section resources \
              --prefix resources \
              --version ${{ inputs.version }} \
              --manifest build/manifest/resources.json \
              --blobs build/blobs

      - name: Upload
        if: steps.pack.outputs.hit != 'true'
        run: |
          aws s3 sync build/blobs "s3://$BUCKET/$PREFIX/blob/" --size-only \
              --cache-control "public, max-age=31536000, immutable"
          aws s3 cp build/manifest/resources.json \
              "s3://$BUCKET/$PREFIX/${{ inputs.channel }}/${{ inputs.version }}/resources.json" \
              --cache-control "no-cache" --content-type application/json

      - name: Record the resource pack
        if: steps.pack.outputs.hit != 'true'
        run: |
          aws s3 cp build/manifest/resources.json \
              "s3://$BUCKET/$INDEX/resources-${{ steps.pack.outputs.key }}.json" \
              --cache-control "no-cache" --content-type application/json

          echo "Packed it." >> "$GITHUB_STEP_SUMMARY"

      - name: Reuse the resource recorded pack
        if: steps.pack.outputs.hit == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if ! jq -e 'has("version")' recorded.json > /dev/null; then
              echo "::error::The recorded manifest carries no version field." \
                   "The manifest format changed; bump PACK_FORMAT."
              exit 1
          fi

          jq --arg v "${{ inputs.version }}" '.version = $v' \
              recorded.json > resources.json

          aws s3 cp resources.json \
              "s3://$BUCKET/$PREFIX/${{ inputs.channel }}/${{ inputs.version }}/resources.json" \
              --cache-control "no-cache" --content-type application/json

          echo "The art has not moved since the last pack; reused it." \
              >> "$GITHUB_STEP_SUMMARY"

  game:
    name: Pack the game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out the build tools
        uses: ./.github/actions/build-tools
        with:
          token: ${{ secrets.BUILD_TOOLS_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Pack
        env:
          BUILD_VERSION: tti-${{ inputs.channel }}-v${{ inputs.version }}
        run: python tools/pack_game.py

      - name: Describe it
        shell: bash
        run: |
          set -euo pipefail

          for tree in build/game/*/; do
              section=$(basename "$tree")

              python tools/build_manifest.py \
                  --tree "$tree" \
                  --section "$section" \
                  --version ${{ inputs.version }} \
                  --manifest "build/manifest/$section.json" \
                  --blobs build/blobs
          done

      - name: Upload
        shell: bash
        run: |
          set -euo pipefail

          aws s3 sync build/blobs "s3://$BUCKET/$PREFIX/blob/" --size-only \
              --cache-control "public, max-age=31536000, immutable"

          for manifest in build/manifest/*.json; do
              aws s3 cp "$manifest" \
                  "s3://$BUCKET/$PREFIX/${{ inputs.channel }}/${{ inputs.version }}/$(basename "$manifest")" \
                  --cache-control "no-cache" --content-type application/json
          done

  engine-mac-arm64:
    name: Engine mac-arm64
    uses: ./.github/workflows/publish-engine.yml
    with:
      target: mac-arm64
      os: macos-26
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}
    secrets: inherit

  engine-mac-x64:
    name: Engine mac-x64
    uses: ./.github/workflows/publish-engine.yml
    with:
      target: mac-x64
      os: macos-26-intel
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}
    secrets: inherit

  engine-win-x64:
    name: Engine win-x64
    uses: ./.github/workflows/publish-engine.yml
    with:
      target: win-x64
      os: windows-2025
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}
    secrets: inherit

  engine-linux-x64:
    name: Engine linux-x64
    uses: ./.github/workflows/publish-engine.yml
    with:
      target: linux-x64
      os: ubuntu-22.04
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}
    secrets: inherit

  platform-mac-arm64:
    name: Platform mac-arm64
    needs: [resources, game, engine-mac-arm64]
    uses: ./.github/workflows/publish-platform.yml
    with:
      target: mac-arm64
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}
      early: ${{ inputs.early }}
    secrets: inherit

  platform-mac-x64:
    name: Platform mac-x64
    needs: [resources, game, engine-mac-x64]
    uses: ./.github/workflows/publish-platform.yml
    with:
      target: mac-x64
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}
      early: ${{ inputs.early }}
    secrets: inherit

  platform-win-x64:
    name: Platform win-x64
    needs: [resources, game, engine-win-x64]
    uses: ./.github/workflows/publish-platform.yml
    with:
      target: win-x64
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}
      early: ${{ inputs.early }}
    secrets: inherit

  platform-linux-x64:
    name: Platform linux-x64
    needs: [resources, game, engine-linux-x64]
    uses: ./.github/workflows/publish-platform.yml
    with:
      target: linux-x64
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}
      early: ${{ inputs.early }}
    secrets: inherit

  publish:
    name: Publish the release
    if: inputs.promote
    needs: [platform-mac-arm64, platform-mac-x64, platform-win-x64, platform-linux-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Point latest.json at tti-${{ inputs.channel }}-v${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          echo '{"version":"${{ inputs.version }}"}' > latest.json
          roots=("s3://$BUCKET/$PREFIX/${{ inputs.channel }}")

          if [ "${{ inputs.channel }}" = live ]; then
              aws s3 sync "s3://$BUCKET/$PREFIX/live/${{ inputs.version }}/" \
                  "s3://$BUCKET/$PREFIX/${{ inputs.version }}/" \
                  --cache-control "no-cache" --content-type application/json
              roots+=("s3://$BUCKET/$PREFIX")
          fi

          for root in "${roots[@]}"; do
              for name in latest latest-mac-arm64 latest-mac-x64 latest-win-x64 latest-linux-x64; do
                  aws s3 cp latest.json "$root/$name.json" \
                      --cache-control "no-cache" --content-type application/json
              done
          done