name: Publish client

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        default: live
        type: string
      promote:
        description: "Point latest.json at this version when the build lands."
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.5)."
        required: true
        type: string
      channel:
        description: "Which channel it goes out on."
        default: live
        type: choice
        options: [live, qa]
      promote:
        description: "Point latest.json at this version when the build lands."
        default: true
        type: boolean

env:
  BUCKET: ttiwebsite
  PREFIX: releases
  INDEX: release-index
  PACK_FORMAT: "1"
  AWS_DEFAULT_REGION: auto
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required

jobs:
  resources:
    name: Pack the resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Check out the build tools
        id: tools
        uses: ./.github/actions/build-tools
        with:
          token: ${{ secrets.BUILD_TOOLS_TOKEN }}

      - name: Look for an identical resource pack
        id: pack
        shell: bash
        run: |
          set -euo pipefail

          art=$(git -C resources rev-parse HEAD)
          key=$(printf '%s\n' \
                  "$PACK_FORMAT" \
                  "$art" \
                  "${{ steps.tools.outputs.sha }}" \
                  "$(sha256sum requirements.txt | cut -d' ' -f1)" \
              | sha256sum | cut -d' ' -f1)

          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Art \`$art\`, pack key \`$key\`." >> "$GITHUB_STEP_SUMMARY"

          if aws s3 cp "s3://$BUCKET/$INDEX/resources-$key.json" recorded.json \
                  --only-show-errors 2> /dev/null; then
              # The sweep may have taken the blobs of a pack no kept release uses:
              missing=$(jq -r '.files[].sha256' recorded.json | sort -u | while read -r sha; do
                  aws s3api head-object --bucket "$BUCKET" --key "$PREFIX/blob/$sha" \
                      > /dev/null 2>&1 || echo "$sha"
              done)

              if [ -n "$missing" ]; then
                  echo "::warning::The recorded resource pack lost $(echo "$missing" | wc -l) blob(s) to the sweep; rebuilding it."
                  echo "hit=false" >> "$GITHUB_OUTPUT"
              else
                  echo "hit=true" >> "$GITHUB_OUTPUT"
              fi
          else
              echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.pack.outputs.hit != 'true'
        with:
          python-version: "3.14"
          cache: pip

      - name: Fetch Panda3D
        if: steps.pack.outputs.hit != 'true'
        uses: ./.github/actions/panda3d
        with:
          target: linux-x64

      - name: Pack the phase multifiles
        if: steps.pack.outputs.hit != 'true'
        run: |
          pip install --disable-pip-version-check wheels/*.whl -r requirements.txt
          python tools/pack_client_resources.py resources build/client/resources

      - name: Describe them
        if: steps.pack.outputs.hit != 'true'
        run: |
          python tools/build_manifest.py \
              --tree build/client/resources \
              --section resources \
              --prefix resources \
              --version ${{ inputs.version }} \
              --manifest build/manifest/resources.json \
              --blobs build/blobs

      - name: Upload
        if: steps.pack.outputs.hit != 'true'
        run: |
          aws s3 sync build/blobs "s3://$BUCKET/$PREFIX/blob/" --size-only \
              --cache-control "public, max-age=31536000, immutable"
          aws s3 cp build/manifest/resources.json \
              "s3://$BUCKET/$PREFIX/${{ inputs.channel }}/${{ inputs.version }}/resources.json" \
              --cache-control "no-cache" --content-type application/json

      - name: Record the resource pack
        if: steps.pack.outputs.hit != 'true'
        run: |
          aws s3 cp build/manifest/resources.json \
              "s3://$BUCKET/$INDEX/resources-${{ steps.pack.outputs.key }}.json" \
              --cache-control "no-cache" --content-type application/json

          echo "Packed it." >> "$GITHUB_STEP_SUMMARY"

      - name: Reuse the resource recorded pack
        if: steps.pack.outputs.hit == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if ! jq -e 'has("version")' recorded.json > /dev/null; then
              echo "::error::The recorded manifest carries no version field." \
                   "The manifest format changed; bump PACK_FORMAT."
              exit 1
          fi

          jq --arg v "${{ inputs.version }}" '.version = $v' \
              recorded.json > resources.json

          aws s3 cp resources.json \
              "s3://$BUCKET/$PREFIX/${{ inputs.channel }}/${{ inputs.version }}/resources.json" \
              --cache-control "no-cache" --content-type application/json

          echo "The art has not moved since the last pack; reused it." \
              >> "$GITHUB_STEP_SUMMARY"

  game:
    name: Pack the game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out the build tools
        uses: ./.github/actions/build-tools
        with:
          token: ${{ secrets.BUILD_TOOLS_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Pack
        env:
          BUILD_VERSION: tti-${{ inputs.channel }}-v${{ inputs.version }}
        run: python tools/pack_game.py

      - name: Describe it
        shell: bash
        run: |
          set -euo pipefail

          for tree in build/game/*/; do
              section=$(basename "$tree")

              python tools/build_manifest.py \
                  --tree "$tree" \
                  --section "$section" \
                  --version ${{ inputs.version }} \
                  --manifest "build/manifest/$section.json" \
                  --blobs build/blobs
          done

      - name: Upload
        shell: bash
        run: |
          set -euo pipefail

          aws s3 sync build/blobs "s3://$BUCKET/$PREFIX/blob/" --size-only \
              --cache-control "public, max-age=31536000, immutable"

          for manifest in build/manifest/*.json; do
              aws s3 cp "$manifest" \
                  "s3://$BUCKET/$PREFIX/${{ inputs.channel }}/${{ inputs.version }}/$(basename "$manifest")" \
                  --cache-control "no-cache" --content-type application/json
          done

  # Python, Panda3D and the libraries the game imports. Rebuilt only when its
  # key moves, which is rare, so most releases reuse the last one:
  engine:
    name: Engine ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            os: macos-latest
          - target: mac-x64
            os: macos-26-intel
          - target: win-x64
            os: windows-2025
          - target: linux-x64
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Check out the build tools
        uses: ./.github/actions/build-tools
        with:
          token: ${{ secrets.BUILD_TOOLS_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      # The Panda3D the engine needs is not on PyPI, so it is built once per
      # pin and kept:
      - name: Fetch Panda3D
        uses: ./.github/actions/panda3d
        with:
          target: ${{ matrix.target }}

      - name: Install Panda3D
        shell: bash
        run: |
          if [ -z "$(ls wheels/*.whl 2>/dev/null)" ]; then
              echo "::error::No Panda3D wheel for ${{ matrix.target }}."
              exit 1
          fi

          pip install --disable-pip-version-check wheels/*.whl

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt -r requirements-build.txt

      # Nuitka rewrites the library paths of what it bundles:
      - name: Ensure patchelf is present
        if: runner.os == 'Linux'
        run: command -v patchelf || (sudo apt-get update && sudo apt-get install -y patchelf)

      - name: Look for an identical engine
        id: engine
        shell: bash
        run: |
          set -euo pipefail

          key=$(python tools/build_engine.py --print-key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Engine key \`$key\`." >> "$GITHUB_STEP_SUMMARY"

          if aws s3 cp "s3://$BUCKET/$INDEX/engine-${{ matrix.target }}-$key.json" recorded.json \
                  --only-show-errors 2> /dev/null; then
              # The sweep may have taken the blobs of a pack no kept release uses:
              missing=$(jq -r '.files[].sha256' recorded.json | sort -u | while read -r sha; do
                  aws s3api head-object --bucket "$BUCKET" --key "$PREFIX/blob/$sha" \
                      > /dev/null 2>&1 || echo "$sha"
              done)

              if [ -n "$missing" ]; then
                  echo "::warning::The recorded engine lost $(echo "$missing" | wc -l) blob(s) to the sweep; rebuilding it."
                  echo "hit=false" >> "$GITHUB_OUTPUT"
              else
                  echo "hit=true" >> "$GITHUB_OUTPUT"
              fi
          else
              echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build it
        if: steps.engine.outputs.hit != 'true'
        run: python tools/build_engine.py

      - name: Describe it
        if: steps.engine.outputs.hit != 'true'
        run: |
          python tools/build_manifest.py \
              --tree build/engine/install \
              --section engine-${{ matrix.target }} \
              --version ${{ inputs.version }} \
              --manifest build/manifest/engine-${{ matrix.target }}.json \
              --blobs build/blobs

      - name: Keep the compilation report
        if: always() && steps.engine.outputs.hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-report-engine-${{ matrix.target }}
          path: build/engine/report-engine.xml
          if-no-files-found: ignore

      - name: Upload it
        if: steps.engine.outputs.hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          aws s3 sync build/blobs "s3://$BUCKET/$PREFIX/blob/" --size-only \
              --cache-control "public, max-age=31536000, immutable"

          manifest=build/manifest/engine-${{ matrix.target }}.json

          aws s3 cp "$manifest" \
              "s3://$BUCKET/$PREFIX/${{ inputs.channel }}/${{ inputs.version }}/$(basename "$manifest")" \
              --cache-control "no-cache" --content-type application/json
          aws s3 cp "$manifest" \
              "s3://$BUCKET/$INDEX/engine-${{ matrix.target }}-${{ steps.engine.outputs.key }}.json" \
              --cache-control "no-cache" --content-type application/json

          echo "Built a new engine." >> "$GITHUB_STEP_SUMMARY"

      - name: Reuse the recorded engine
        if: steps.engine.outputs.hit == 'true'
        shell: bash
        run: |
          set -euo pipefail

          jq --arg v "${{ inputs.version }}" '.version = $v' \
              recorded.json > engine.json

          aws s3 cp engine.json \
              "s3://$BUCKET/$PREFIX/${{ inputs.channel }}/${{ inputs.version }}/engine-${{ matrix.target }}.json" \
              --cache-control "no-cache" --content-type application/json

          echo "Nothing the engine carries has moved; reused it." >> "$GITHUB_STEP_SUMMARY"

  # The launchers already installed read one section per platform:
  legacy:
    name: Compose the manifests installed launchers read
    needs: [game, engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out the build tools
        uses: ./.github/actions/build-tools
        with:
          token: ${{ secrets.BUILD_TOOLS_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Compose
        shell: bash
        run: |
          set -euo pipefail

          release="s3://$BUCKET/$PREFIX/${{ inputs.channel }}/${{ inputs.version }}"

          aws s3 sync "$release/" manifests/ --only-show-errors
          python tools/legacy_manifests.py --manifests manifests --version ${{ inputs.version }}

          for target in mac-arm64 mac-x64 win-x64 linux-x64; do
              for section in "$target" "host-$target"; do
                  aws s3 cp "manifests/$section.json" "$release/$section.json" \
                      --cache-control "no-cache" --content-type application/json
              done
          done

  publish:
    name: Publish the release
    if: inputs.promote
    needs: [resources, game, engine, legacy]
    runs-on: ubuntu-latest
    steps:
      - name: Point latest.json at tti-${{ inputs.channel }}-v${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          echo '{"version":"${{ inputs.version }}"}' > latest.json
          aws s3 cp latest.json "s3://$BUCKET/$PREFIX/${{ inputs.channel }}/latest.json" \
              --cache-control "no-cache" --content-type application/json

          if [ "${{ inputs.channel }}" = live ]; then
              aws s3 sync "s3://$BUCKET/$PREFIX/live/${{ inputs.version }}/" \
                  "s3://$BUCKET/$PREFIX/${{ inputs.version }}/" \
                  --cache-control "no-cache" --content-type application/json
              aws s3 cp latest.json "s3://$BUCKET/$PREFIX/latest.json" \
                  --cache-control "no-cache" --content-type application/json
          fi