# Ran manually and not on every release
name: Build astrond

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin
            arch: arm64
            name: darwin-arm64
          # going away away in August 2027
          - os: macos-15-intel
            target: darwin
            arch: x86_64
            name: darwin-x86_64
          - os: ubuntu-latest
            target: linux
            arch: x86_64
            name: linux
          - os: windows-latest
            target: win32
            arch: x86_64
            name: win32

    steps:
      - uses: actions/checkout@v5

      - name: Check out the build tools
        uses: ./.github/actions/build-tools
        with:
          token: ${{ secrets.BUILD_TOOLS_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install the system dependencies
        shell: bash
        run: python tools/build_astrond.py --install-deps --target ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          python tools/build_astrond.py --target ${{ matrix.target }} \
              --arch ${{ matrix.arch }} --output out

      - name: Show what it links
        shell: bash
        run: ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: astrond-${{ matrix.name }}
          path: out/*
          if-no-files-found: error