name: Prune old releases

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      keep:
        description: "How many releases stay installable, newest first."
        default: "3"
        type: string
      apply:
        description: "Delete. Off is just a dry run."
        default: false
        type: boolean

concurrency:
  # Never sweep while a release is being published
  group: releases
  cancel-in-progress: false

jobs:
  prune:
    name: Sweep orphaned blobs
    runs-on: ubuntu-latest
    env:
      BUCKET: ttiwebsite
      PREFIX: releases
      AWS_DEFAULT_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required

    steps:
      - name: Check out the build tools
        shell: bash
        env:
          BUILD_TOOLS_TOKEN: ${{ secrets.BUILD_TOOLS_TOKEN }}
        run: |
          echo "::add-mask::$BUILD_TOOLS_TOKEN"

          auth=$(printf 'oauth2:%s' "$BUILD_TOOLS_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"

          git init -q tools
          git -C tools remote add origin \
            https://git.toontown.io/toontown-infinite/build-tools.git
          git -C tools -c http.extraheader="Authorization: Basic $auth" \
            fetch -q --depth 1 origin HEAD
          git -C tools checkout -q FETCH_HEAD

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Sweep
        run: |
          python tools/prune_releases.py \
              --bucket "$BUCKET" \
              --prefix "$PREFIX" \
              --keep "${{ inputs.keep || 3 }}" \
              ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }} \
              | tee "$GITHUB_STEP_SUMMARY"