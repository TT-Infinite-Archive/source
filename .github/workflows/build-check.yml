name: Build check

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Needs no secrets, so it runs on pull requests from forks too
  compile:
    name: Python compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Compile
        run: python -m compileall -q otp toontown scripts

  server:
    name: Game server image
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      BUCKET: ttiwebsite
      INDEX: release-index
      AWS_DEFAULT_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Check out the build tools
        uses: ./.github/actions/build-tools
        with:
          token: ${{ secrets.BUILD_TOOLS_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Fetch Panda3D
        uses: ./.github/actions/panda3d
        with:
          target: linux-x64

      - name: Assemble server resources
        run: |
          pip install --disable-pip-version-check wheels/*.whl -r requirements.txt
          python tools/pack_server_resources.py resources build/resources

      - uses: docker/setup-buildx-action@v4

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: tti-server:check
          build-args: BUILD_VERSION=check
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build astron image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/astron/Dockerfile
          push: false
          load: true
          tags: tti-astron:check
          build-args: BUILD_VERSION=check
          cache-from: type=gha,scope=astron
          cache-to: type=gha,scope=astron,mode=max

      - name: Smoke test
        run: docker compose -f docker/compose.check.yaml up --wait --wait-timeout 300

      - name: Logs
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            docker compose -f docker/compose.check.yaml logs --tail 60
          else
            docker compose -f docker/compose.check.yaml logs
          fi

      - name: Stop
        if: always()
        run: docker compose -f docker/compose.check.yaml down -v