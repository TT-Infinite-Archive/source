name: Build check

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Game server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out the build tools
        shell: bash
        env:
          BUILD_TOOLS_TOKEN: ${{ secrets.BUILD_TOOLS_TOKEN }}
        run: |
          echo "::add-mask::$BUILD_TOOLS_TOKEN"

          auth=$(printf 'oauth2:%s' "$BUILD_TOOLS_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"

          git init -q tools
          git -C tools remote add origin \
            https://git.toontown.io/toontown-infinite/build-tools.git
          git -C tools -c http.extraheader="Authorization: Basic $auth" \
            fetch -q --depth 1 origin HEAD
          git -C tools checkout -q FETCH_HEAD

      - name: Check out the resources
        uses: actions/checkout@v5
        with:
          repository: TT-Infinite-Archive/resources
          path: art
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Assemble server resources
        run: |
          pip install --disable-pip-version-check -r requirements.txt
          tools/build-server-resources.sh art build/resources

      - uses: docker/setup-buildx-action@v4

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: tti-server:check
          build-args: SERVER_VERSION=check
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build astron image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/astron/Dockerfile
          push: false
          load: true
          tags: tti-astron:check
          build-args: SERVER_VERSION=check
          cache-from: type=gha,scope=astron
          cache-to: type=gha,scope=astron,mode=max

      - name: Smoke test
        run: docker compose -f docker/compose.check.yaml up --wait --wait-timeout 300

      - name: Logs
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            docker compose -f docker/compose.check.yaml logs --tail 60
          else
            docker compose -f docker/compose.check.yaml logs
          fi

      - name: Stop
        if: always()
        run: docker compose -f docker/compose.check.yaml down -v