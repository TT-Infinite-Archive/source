name: Build check

# The publish workflow only runs on a tag, so without this a broken Dockerfile
# or a resource prune that stops being equivalent is not found until release.
# Builds the same images, pushes nothing.

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Game server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the art
        uses: actions/checkout@v4
        with:
          repository: TT-Infinite-Archive/resources
          path: art
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # The point of this job is to prove the art in the image is enough to build the game: the district's healthcheck only passes once it has made itself available.
      - name: Assemble server resources
        run: |
          pip install --disable-pip-version-check -r requirements.txt
          tools/build-server-resources.sh art build/resources

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: tti-server:check
          build-args: SERVER_VERSION=check
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/astron/Dockerfile
          push: false
          load: true
          tags: tti-astron:check
          build-args: SERVER_VERSION=check
          cache-from: type=gha,scope=astron

      - name: Smoke test
        run: docker compose -f docker/compose.check.yaml up --wait --wait-timeout 300

      - name: Logs
        if: always()
        run: docker compose -f docker/compose.check.yaml logs --tail 60

      - name: Stop
        if: always()
        run: docker compose -f docker/compose.check.yaml down -v

  astron:
    name: Astron image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/astron/Dockerfile
          push: false
          build-args: SERVER_VERSION=check
          cache-from: type=gha,scope=astron
          cache-to: type=gha,scope=astron,mode=max
