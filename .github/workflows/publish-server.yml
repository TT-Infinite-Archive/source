name: Publish server images

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        default: live
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.5)."
        required: true
        type: string
      channel:
        description: "Which channel it goes out on."
        default: live
        type: choice
        options: [live, qa]

jobs:
  publish:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      BUCKET: ttiwebsite
      INDEX: release-index
      AWS_DEFAULT_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    strategy:
      fail-fast: false
      matrix:
        include:
          # The districts and the UberDOG run out of this one:
          - image: server
            file: Dockerfile
            resources: true
          # Ships the committed astrond binary; see docker/astron/Dockerfile:
          - image: astron
            file: docker/astron/Dockerfile
            resources: false

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: ${{ matrix.resources }}

      - name: Check out the build tools
        uses: ./.github/actions/build-tools
        with:
          token: ${{ secrets.BUILD_TOOLS_TOKEN }}

      - uses: actions/setup-python@v6
        if: matrix.resources
        with:
          python-version: "3.14"
          cache: pip

      - name: Fetch Panda3D
        if: matrix.resources
        uses: ./.github/actions/panda3d
        with:
          target: linux-x64

      - name: Assemble server resources
        if: matrix.resources
        run: |
          pip install --disable-pip-version-check wheels/*.whl -r requirements.txt
          python tools/pack_server_resources.py resources build/resources

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the protocol version
        id: protocol
        shell: bash
        run: |
          set -euo pipefail

          value=$(awk '$1 == "server-version" { print $2; exit }' \
                  config/distribution/live.prc)

          if [ -z "$value" ]; then
              echo "::error::config/distribution/live.prc names no server-version."
              exit 1
          fi

          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Name the image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          repo="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

          if [ "${{ matrix.image }}" = astron ]; then
              version="${{ steps.protocol.outputs.value }}"
          else
              version="tti-${{ inputs.channel }}-v${{ inputs.version }}"
          fi

          {
              echo "tags<<TAGS"
              echo "$repo:$version"
              # :latest is whatever is live:
              if [ "${{ inputs.channel }}" = live ]; then
                  echo "$repo:latest"
              fi
              echo TAGS
          } >> "$GITHUB_OUTPUT"

      - name: Look for an astron image on this protocol
        id: existing
        if: matrix.image == 'astron'
        shell: bash
        run: |
          tag="${{ steps.image.outputs.repo }}:${{ steps.protocol.outputs.value }}"

          if docker buildx imagetools inspect "$tag" > /dev/null 2>&1; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Protocol \`${{ steps.protocol.outputs.value }}\` is already published; keeping it." \
                  >> "$GITHUB_STEP_SUMMARY"
          else
              echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v7
        if: steps.existing.outputs.skip != 'true'
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: |
            BUILD_VERSION=tti-${{ inputs.channel }}-v${{ inputs.version }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max