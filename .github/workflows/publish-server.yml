name: Publish server images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0)."
        required: true
        type: string

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - id: version
        shell: bash
        run: |
          VALUE="${{ inputs.version || github.ref_name }}"
          echo "value=${VALUE#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and push ${{ matrix.image }}
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The districts and the UberDOG run out of this one:
          - image: server
            file: Dockerfile
            resources: true
          # Compiles Astron and both Mongo drivers from source:
          - image: astron
            file: docker/astron/Dockerfile
            resources: false

    steps:
      - uses: actions/checkout@v5

      # The server's slice of the art has to exist before the build
      # Since the art is its own repository, the Dockerfile cannot reach it
      - name: Check out the art
        if: matrix.resources
        uses: actions/checkout@v5
        with:
          repository: TT-Infinite-Archive/resources
          path: art
          fetch-depth: 1

      - uses: actions/setup-python@v6
        if: matrix.resources
        with:
          python-version: "3.14"
          cache: pip

      - name: Assemble server resources
        if: matrix.resources
        run: |
          pip install --disable-pip-version-check -r requirements.txt
          tools/build-server-resources.sh art build/resources

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: |
            SERVER_VERSION=${{ needs.version.outputs.value }}
          tags: |
            ${{ needs.version.outputs.image }}-${{ matrix.image }}:${{ needs.version.outputs.value }}
            ${{ needs.version.outputs.image }}-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Deploy
    needs: [version, publish]
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.version.outputs.value }}
    secrets: inherit