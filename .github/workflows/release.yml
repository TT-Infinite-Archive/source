name: Release

on:
  push:
    tags:
      - "v*"
      - "tti-*-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.5)."
        required: true
        type: string
      channel:
        description: "Which channel it goes out on."
        default: live
        type: choice
        options: [live, qa]

concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - id: version
        shell: bash
        run: |
          set -euo pipefail

          REF="${{ inputs.version || github.ref_name }}"
          CHANNEL="${{ inputs.channel || 'live' }}"

          case "$REF" in
              tti-*-v*)
                  NAME="${REF#tti-}"
                  CHANNEL="${NAME%%-v*}"
                  VALUE="${NAME#*-v}"
                  ;;
              *)
                  VALUE="${REF#v}"
                  ;;
          esac

          case "$VALUE" in
              [0-9]*) ;;
              *) echo "::error::No version to release in '$REF'."; exit 1 ;;
          esac

          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

  server:
    name: Server
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-server.yml
    with:
      version: ${{ needs.version.outputs.value }}
      channel: ${{ needs.version.outputs.channel }}
    secrets: inherit

  client:
    name: Client
    needs: version
    uses: ./.github/workflows/publish-client.yml
    with:
      version: ${{ needs.version.outputs.value }}
      channel: ${{ needs.version.outputs.channel }}
      promote: false
    secrets: inherit

  deploy:
    name: Deploy
    needs: [version, server, client]
    if: needs.version.outputs.channel == 'live'
    uses: ./.github/workflows/deploy.yml
    with:
      tag: tti-${{ needs.version.outputs.channel }}-v${{ needs.version.outputs.value }}
    secrets: inherit

  # Last, so the launcher only offers the new client once there is a server
  # that will accept it. On qa there is no deploy to wait for.
  promote:
    name: Promote tti-${{ needs.version.outputs.channel }}-v${{ needs.version.outputs.value }}
    needs: [version, server, client, deploy]
    if: >-
      !cancelled()
      && needs.server.result == 'success'
      && needs.client.result == 'success'
      && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      BUCKET: ttiwebsite
      PREFIX: releases
      CHANNEL: ${{ needs.version.outputs.channel }}
      VERSION: ${{ needs.version.outputs.value }}
      AWS_DEFAULT_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    steps:
      - name: Point latest.json at tti-${{ env.CHANNEL }}-v${{ env.VERSION }}
        shell: bash
        run: |
          set -euo pipefail

          echo "{\"version\":\"$VERSION\"}" > latest.json
          aws s3 cp latest.json "s3://$BUCKET/$PREFIX/$CHANNEL/latest.json" \
              --cache-control "no-cache" --content-type application/json

          if [ "$CHANNEL" = live ]; then
              aws s3 sync "s3://$BUCKET/$PREFIX/live/$VERSION/" \
                  "s3://$BUCKET/$PREFIX/$VERSION/" \
                  --cache-control "no-cache" --content-type application/json
              aws s3 cp latest.json "s3://$BUCKET/$PREFIX/latest.json" \
                  --cache-control "no-cache" --content-type application/json
          fi
