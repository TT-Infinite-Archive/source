# Astron's configuration for the containerised stack.
#
# Two things here are easy to miss:
#   - the uberdogs list must match generate-global-object in
#     config/distribution/live.prc, or the UberDOG and Astron disagree about
#     which doIds exist
#
#   - `version` must equal server-version in live.prc
daemon:
    name: Toontown Infinite

general:
    eventlogger: 127.0.0.1:7020
    dc_files:
        - /astron/dclass/vanilla.dc

# ClientServicesManager is the only anonymous one because clients talk to it before they have authenticated
uberdogs:
    - {class: CentralLogger,               id: 4688, anonymous: false}
    - {class: ClientServicesManager,       id: 4665, anonymous: true}
    - {class: ChatAgent,                   id: 4681, anonymous: false}
    - {class: FriendManager,               id: 4501, anonymous: false}
    - {class: AvatarFriendsManager,        id: 4686, anonymous: false}
    - {class: PlayerFriendsManager,        id: 4687, anonymous: false}
    - {class: TTIFriendsManager,           id: 4666, anonymous: false}
    - {class: TTSpeedchatRelay,            id: 4712, anonymous: false}
    - {class: DistributedDeliveryManager,  id: 4683, anonymous: false}
    - {class: DistributedDataStoreManager, id: 4684, anonymous: false}
    - {class: DistributedPartyManager,     id: 4691, anonymous: false}
    - {class: TTCodeRedemptionMgr,         id: 4695, anonymous: false}

messagedirector:
    bind: 0.0.0.0:7010

roles:
    - type: clientagent
      bind: 0.0.0.0:7000
      version: "SERVER_VERSION"
      client:
        relocate: true
        add_interest: enabled
      channels:
        min: 2000000000
        max: 2000999999

    - type: stateserver
      control: 4002

    - type: database
      control: 4003
      generate:
        min: 100000000
        max: 399999999
      backend:
        type: mongodb
        server: mongodb://mongo:27017/game

    - type: dbss
      database: 4003
      ranges:
        - min: 100000000
          max: 399999999

    - type: eventlogger
      bind: 0.0.0.0:7020
      output: /astron/logs/events-%y%m%d_%H%M%S.log
